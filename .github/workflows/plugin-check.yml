name: Plugin Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: .
          exclude-directories: .git,.github,.wordpress-org,tests,vendor,node_modules
          exclude-files: .distignore,.editorconfig,.gitattributes,.gitignore,CHANGELOG.md,CODE_OF_CONDUCT.md,CONTRIBUTING.md,SECURITY.md,composer.json,composer.lock,phpcs.xml.dist,phpstan-bootstrap.php,phpstan.neon,phpunit.xml.dist
